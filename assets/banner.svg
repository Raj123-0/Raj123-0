<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="35%" stop-color="#0D1B2A"/>
      <stop offset="65%" stop-color="#0A1F12"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="10%" stop-color="#58A6FF"/>
      <stop offset="35%" stop-color="#39D353"/>
      <stop offset="65%" stop-color="#39D353"/>
      <stop offset="90%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="18%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bg)" rx="18"/>
  <rect width="900" height="260" fill="url(#blueGlow)" rx="18"/>
  <rect width="900" height="260" fill="url(#greenGlow)" rx="18"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#58A6FF" stroke-width="0.8">
    <line x1="0" y1="65" x2="900" y2="65"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="195" x2="900" y2="195"/>
    <line x1="225" y1="0" x2="225" y2="260"/>
    <line x1="450" y1="0" x2="450" y2="260"/>
    <line x1="675" y1="0" x2="675" y2="260"/>
  </g>

  <!-- Orbit paths -->
  <ellipse cx="450" cy="130" rx="390" ry="85" fill="none" stroke="#58A6FF" stroke-width="1" opacity="0.07" stroke-dasharray="4,8"/>
  <ellipse cx="450" cy="130" rx="310" ry="58" fill="none" stroke="#39D353" stroke-width="1" opacity="0.06" stroke-dasharray="4,8"/>

  <!-- Floating math symbols -->
  <text x="35" y="42" font-size="34" fill="#58A6FF" opacity="0.16" font-family="Georgia, serif" font-style="italic">&#8721;</text>
  <text x="820" y="45" font-size="38" fill="#39D353" opacity="0.16" font-family="Georgia, serif" font-style="italic">&#8747;</text>
  <text x="65" y="225" font-size="32" fill="#58A6FF" opacity="0.14" font-family="Georgia, serif" font-style="italic">&#960;</text>
  <text x="810" y="230" font-size="36" fill="#39D353" opacity="0.14" font-family="Georgia, serif" font-style="italic">&#8734;</text>
  <text x="350" y="28" font-size="26" fill="#58A6FF" opacity="0.11" font-family="Georgia, serif">&#8711;</text>
  <text x="155" y="235" font-size="24" fill="#39D353" opacity="0.11" font-family="Georgia, serif" font-style="italic">&#8706;</text>
  <text x="690" y="32" font-size="28" fill="#58A6FF" opacity="0.11" font-family="Georgia, serif" font-style="italic">&#952;</text>
  <text x="530" y="230" font-size="24" fill="#58A6FF" opacity="0.10" font-family="Georgia, serif">&#955;</text>
  <text x="245" y="30" font-size="22" fill="#39D353" opacity="0.09" font-family="Georgia, serif">&#937;</text>
  <text x="610" y="235" font-size="22" fill="#39D353" opacity="0.09" font-family="Georgia, serif" font-style="italic">&#966;</text>

  <!-- Rocket with glow -->
  <g transform="translate(430, 30) scale(0.48)" opacity="0.18">
    <path d="M30 0 C44 16 50 38 50 60 L50 78 L36 70 L30 82 L24 70 L10 78 L10 60 C10 38 16 16 30 0 Z" fill="#58A6FF" filter="url(#softGlow)"/>
    <path d="M30 0 C44 16 50 38 50 60 L50 78 L36 70 L30 82 L24 70 L10 78 L10 60 C10 38 16 16 30 0 Z" fill="#58A6FF"/>
    <circle cx="30" cy="34" r="7" fill="#0D1117"/>
    <path d="M24 70 L14 86 L24 78 Z" fill="#39D353"/>
    <path d="M36 70 L46 86 L36 78 Z" fill="#39D353"/>
  </g>

  <!-- Top accent bar -->
  <rect x="60" y="78" width="780" height="3" fill="url(#accentBar)" rx="1.5"/>

  <!-- Name — high contrast white with blue glow -->
  <text x="450" y="145" font-size="46" font-weight="700" fill="#FFFFFF"
        text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" letter-spacing="3"
        filter="url(#textGlow)">
    Rajveer Pardeshi
  </text>

  <!-- Subtitle with gradient -->
  <text x="450" y="180" font-size="16" fill="#79C0FF"
        text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" letter-spacing="8" opacity="0.9">
    MATH  &#8226;  CS  &#8226;  PHYSICS  &#8226;  CRYPTO
  </text>

  <!-- GitHub handle -->
  <text x="450" y="212" font-size="14" fill="#39D353"
        text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" opacity="0.7" letter-spacing="2">
    @Raj123-0
  </text>

  <!-- Bottom accent dots -->
  <circle cx="390" cy="240" r="3" fill="#58A6FF" opacity="0.5"/>
  <circle cx="415" cy="240" r="3" fill="#39D353" opacity="0.5"/>
  <circle cx="440" cy="240" r="3" fill="#58A6FF" opacity="0.5"/>
  <circle cx="460" cy="240" r="3" fill="#39D353" opacity="0.5"/>
  <circle cx="485" cy="240" r="3" fill="#58A6FF" opacity="0.5"/>
  <circle cx="510" cy="240" r="3" fill="#39D353" opacity="0.5"/>
</svg>