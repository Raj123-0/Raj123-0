<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="40%" stop-color="#111B2A"/>
      <stop offset="70%" stop-color="#0F1B14"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#39D353"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="10%" stop-color="#58A6FF"/>
      <stop offset="40%" stop-color="#39D353"/>
      <stop offset="60%" stop-color="#39D353"/>
      <stop offset="90%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bg)" rx="18"/>
  <rect width="900" height="240" fill="url(#glowLeft)" rx="18"/>
  <rect width="900" height="240" fill="url(#glowRight)" rx="18"/>

  <!-- Decorative grid lines -->
  <g opacity="0.04" stroke="#58A6FF" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="225" y1="0" x2="225" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="675" y1="0" x2="675" y2="240"/>
  </g>

  <!-- Orbit path -->
  <ellipse cx="450" cy="120" rx="380" ry="80" fill="none" stroke="#58A6FF" stroke-width="1" opacity="0.06" stroke-dasharray="4,8"/>
  <ellipse cx="450" cy="120" rx="300" ry="55" fill="none" stroke="#39D353" stroke-width="1" opacity="0.05" stroke-dasharray="4,8"/>

  <!-- Floating math symbols -->
  <text x="45" y="42" font-size="32" fill="#58A6FF" opacity="0.15" font-family="Georgia, serif" font-style="italic">&#8721;</text>
  <text x="810" y="45" font-size="36" fill="#39D353" opacity="0.15" font-family="Georgia, serif" font-style="italic">&#8747;</text>
  <text x="75" y="205" font-size="30" fill="#58A6FF" opacity="0.12" font-family="Georgia, serif" font-style="italic">&#960;</text>
  <text x="790" y="210" font-size="34" fill="#39D353" opacity="0.12" font-family="Georgia, serif" font-style="italic">&#8734;</text>
  <text x="360" y="28" font-size="24" fill="#58A6FF" opacity="0.10" font-family="Georgia, serif">&#8711;</text>
  <text x="160" y="218" font-size="22" fill="#39D353" opacity="0.10" font-family="Georgia, serif" font-style="italic">&#8706;</text>
  <text x="680" y="32" font-size="26" fill="#58A6FF" opacity="0.10" font-family="Georgia, serif" font-style="italic">&#952;</text>
  <text x="520" y="215" font-size="22" fill="#58A6FF" opacity="0.09" font-family="Georgia, serif">&#955;</text>
  <text x="250" y="30" font-size="20" fill="#39D353" opacity="0.08" font-family="Georgia, serif">&#937;</text>
  <text x="600" y="220" font-size="20" fill="#39D353" opacity="0.08" font-family="Georgia, serif" font-style="italic">&#966;</text>
  <text x="430" y="220" font-size="18" fill="#58A6FF" opacity="0.07" font-family="Georgia, serif">&#8463;</text>

  <!-- Rocket icon -->
  <g transform="translate(428, 38) scale(0.5)" opacity="0.15">
    <path d="M30 0 C44 16 50 38 50 60 L50 78 L36 70 L30 82 L24 70 L10 78 L10 60 C10 38 16 16 30 0 Z" fill="#58A6FF" filter="url(#glow)"/>
    <circle cx="30" cy="34" r="7" fill="#0D1117"/>
    <path d="M24 70 L14 86 L24 78 Z" fill="#39D353"/>
    <path d="M36 70 L46 86 L36 78 Z" fill="#39D353"/>
  </g>

  <!-- Top accent bar -->
  <rect x="50" y="72" width="800" height="2.5" fill="url(#accentBar)" rx="1.25"/>

  <!-- Name -->
  <text x="450" y="135" font-size="40" font-weight="700" fill="url(#nameGrad)"
        text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', 'Courier New', monospace" letter-spacing="2">
    Rajveer Pardeshi
  </text>

  <!-- Subtitle -->
  <text x="450" y="168" font-size="14" fill="#8B949E"
        text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" letter-spacing="6" opacity="0.85">
    MATH  &#8226;  CS  &#8226;  PHYSICS  &#8226;  CRYPTO
  </text>

  <!-- GitHub handle -->
  <text x="450" y="195" font-size="13" fill="#58A6FF"
        text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" opacity="0.55" letter-spacing="1">
    @Raj123-0
  </text>

  <!-- Bottom accent dots -->
  <circle cx="405" cy="215" r="2.5" fill="#58A6FF" opacity="0.4"/>
  <circle cx="425" cy="215" r="2.5" fill="#39D353" opacity="0.4"/>
  <circle cx="445" cy="215" r="2.5" fill="#58A6FF" opacity="0.4"/>
  <circle cx="465" cy="215" r="2.5" fill="#39D353" opacity="0.4"/>
  <circle cx="485" cy="215" r="2.5" fill="#58A6FF" opacity="0.4"/>
</svg>