<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#39D353"/>
      <stop offset="85%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#39D353"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="230" fill="url(#bg)" rx="16"/>
  <rect width="840" height="230" fill="url(#glow)" rx="16"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#58A6FF" stroke-width="1">
    <line x1="0" y1="57" x2="840" y2="57"/>
    <line x1="0" y1="115" x2="840" y2="115"/>
    <line x1="0" y1="172" x2="840" y2="172"/>
    <line x1="210" y1="0" x2="210" y2="230"/>
    <line x1="420" y1="0" x2="420" y2="230"/>
    <line x1="630" y1="0" x2="630" y2="230"/>
  </g>

  <!-- Floating math symbols -->
  <text x="55" y="48" font-size="30" fill="#58A6FF" opacity="0.13" font-family="Georgia, serif">&#8721;</text>
  <text x="760" y="52" font-size="34" fill="#39D353" opacity="0.13" font-family="Georgia, serif">&#8747;</text>
  <text x="90" y="195" font-size="28" fill="#58A6FF" opacity="0.10" font-family="Georgia, serif">&#960;</text>
  <text x="720" y="200" font-size="32" fill="#39D353" opacity="0.10" font-family="Georgia, serif">&#8734;</text>
  <text x="390" y="36" font-size="24" fill="#58A6FF" opacity="0.08" font-family="Georgia, serif">&#8711;</text>
  <text x="170" y="205" font-size="22" fill="#39D353" opacity="0.08" font-family="Georgia, serif">&#8706;</text>
  <text x="640" y="42" font-size="26" fill="#58A6FF" opacity="0.08" font-family="Georgia, serif">&#952;</text>
  <text x="510" y="200" font-size="22" fill="#58A6FF" opacity="0.08" font-family="Georgia, serif">&#955;</text>
  <text x="280" y="40" font-size="20" fill="#39D353" opacity="0.07" font-family="Georgia, serif">&#937;</text>
  <text x="580" y="200" font-size="20" fill="#39D353" opacity="0.07" font-family="Georgia, serif">&#966;</text>

  <!-- Rocket silhouette -->
  <g transform="translate(402, 42) scale(0.55)" opacity="0.12">
    <path d="M30 0 C42 14 48 34 48 54 L48 72 L34 64 L24 78 L14 64 L0 72 L0 54 C0 34 6 14 30 0 Z" fill="#58A6FF"/>
    <circle cx="24" cy="30" r="6" fill="#0D1117"/>
    <path d="M14 64 L4 80 L14 72 Z" fill="#39D353"/>
    <path d="M34 64 L44 80 L34 72 Z" fill="#39D353"/>
  </g>

  <!-- Accent line -->
  <rect x="70" y="82" width="700" height="2" fill="url(#accent)" rx="1"/>

  <!-- Name -->
  <text x="420" y="140" font-size="44" font-weight="700" fill="#FFFFFF"
        text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', 'Courier New', monospace" letter-spacing="3">
    Raj123-0
  </text>

  <!-- Subtitle -->
  <text x="420" y="175" font-size="15" fill="url(#nameGrad)"
        text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" letter-spacing="4" opacity="0.9">
    MATH  &#183;  CS  &#183;  PHYSICS  &#183;  CRYPTO
  </text>

  <!-- Bottom accent dots -->
  <circle cx="390" cy="200" r="2.5" fill="#58A6FF" opacity="0.45"/>
  <circle cx="420" cy="200" r="2.5" fill="#39D353" opacity="0.45"/>
  <circle cx="450" cy="200" r="2.5" fill="#58A6FF" opacity="0.45"/>
</svg>